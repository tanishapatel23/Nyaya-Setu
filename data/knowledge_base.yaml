# NyaySetu knowledge base.
#
# Every legal statement the app makes comes from this file. The model can
# rephrase it but not add to it: core/guard.py strips any section or Act that
# is not listed here. Each fact has a source_note so a lawyer can re-check it.
# Last checked by hand on 2026-11-10.

meta:
  last_verified: "2026-11-10"
  disclaimer:
    en: >-
      NyaySetu gives general legal information, not legal advice. It is not
      a lawyer. For anything serious, urgent or already in court, talk to an
      advocate. Free legal aid is available on the NALSA helpline 15100.
    hi: >-
      न्यायसेतु सामान्य कानूनी जानकारी देता है, कानूनी सलाह नहीं। यह वकील नहीं है।
      गंभीर, जल्दी वाले या अदालत में चल रहे मामले में किसी वकील से बात करें।
      मुफ़्त कानूनी सहायता के लिए NALSA हेल्पलाइन 15100 पर कॉल करें।

helplines:
  - id: nalsa
    name: {en: "NALSA free legal aid", hi: "NALSA मुफ़्त कानूनी सहायता"}
    contact: "15100"
    what:
      en: Free advice from a panel lawyer, and help applying for a free lawyer.
      hi: पैनल वकील से मुफ़्त सलाह, और मुफ़्त वकील के लिए आवेदन में मदद।
    for: [deposit, refund, salary, notice]
  - id: nch
    name: {en: "National Consumer Helpline", hi: "राष्ट्रीय उपभोक्ता हेल्पलाइन"}
    contact: "1915 or 1800-11-4000, WhatsApp 8800001915, consumerhelpline.gov.in"
    what:
      en: Free complaint before going to court. The company is contacted for you, and many cases settle here.
      hi: अदालत से पहले मुफ़्त शिकायत। कंपनी से आपकी ओर से संपर्क किया जाता है और कई मामले यहीं सुलझ जाते हैं।
    for: [refund]
  - id: edaakhil
    name: {en: "e-Daakhil", hi: "ई-दाखिल"}
    contact: "edaakhil.nic.in"
    what:
      en: File a consumer complaint online yourself and track it.
      hi: उपभोक्ता शिकायत ख़ुद ऑनलाइन दर्ज करें और उसकी स्थिति देखें।
    for: [refund]
  - id: samadhan
    name: {en: "SAMADHAN labour portal", hi: "समाधान श्रम पोर्टल"}
    contact: "samadhan.labour.gov.in"
    what:
      en: File a wage claim with the labour department online and track it.
      hi: वेतन का दावा श्रम विभाग में ऑनलाइन दर्ज करें और उसकी स्थिति देखें।
    for: [salary]

